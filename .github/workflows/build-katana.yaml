name: Build Katana Images

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build katana_base image
        run: |
          cd docker-base
          bash build_base.sh

      - name: Save katana_base image
        run: |
          docker save katana_base:latest -o katana_base.tar

      - name: Build katana main image
        run: |
          docker build -t katana:latest .

      - name: Save katana image
        run: |
          docker save katana:latest -o katana.tar

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: katana-build
          files: |
            katana_base.tar
            katana.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

